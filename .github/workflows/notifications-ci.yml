name: Notifications Microservice CI

on:
  push:
    branches: ["main"]
    paths:
      - "Backend/Notifications/**"
      - "Backend/Shared/**"
      - "Backend/Directory.Packages.props"
      - "Backend/nuget.config"
      - ".github/workflows/notifications-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Backend/Notifications/**"
      - "Backend/Shared/**"
      - "Backend/Directory.Packages.props"
      - "Backend/nuget.config"
      - ".github/workflows/notifications-ci.yml"

defaults:
  run:
    working-directory: ./Backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"yarmatss_InnoClinic_Notifications" \
            /o:"yarmatss" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.coverage.exclusions="**/*"

      - name: Restore dependencies
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: dotnet restore InnoClinic.Notifications.slnx

      - name: Build
        run: dotnet build InnoClinic.Notifications.slnx --no-restore --configuration Release

      - name: End SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
