name: Notifications Microservice CD

on:
  workflow_run:
    workflows: ["Notifications Microservice CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  RESOURCE_GROUP: rg-innoclinic-dev
  CONTAINER_APP_NAME: notifications-worker
  IMAGE_NAME: innoclinic-notifications-worker
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build & Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Notifications Worker image
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          file: ./Backend/Notifications/Notifications.Worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          secrets: |
            NUGET_USER=${{ secrets.NUGET_USER }}
            NUGET_TOKEN=${{ secrets.NUGET_TOKEN }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Notifications Worker
        uses: azure/cli@v3
        with:
          inlineScript: |
            az containerapp update \
              --name "${CONTAINER_APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --image "${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.event.workflow_run.head_sha }}"
