name: Profiles Microservice CI

on:
  push:
    branches: ["main"]
    paths:
      - "Backend/Profiles/**"
      - "Backend/Shared/**"
      - "Backend/Directory.Packages.props"
      - "Backend/nuget.config"
      - ".github/workflows/profiles-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "Backend/Profiles/**"
      - "Backend/Shared/**"
      - "Backend/Directory.Packages.props"
      - "Backend/nuget.config"
      - ".github/workflows/profiles-ci.yml"

defaults:
  run:
    working-directory: ./Backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarScanner tool
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: ~/.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: dotnet tool install dotnet-sonarscanner --tool-path ~/.sonar/scanner

      - name: Begin SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ~/.sonar/scanner/dotnet-sonarscanner begin \
            /k:"yarmatss_InnoClinic_Profiles" \
            /o:"yarmatss" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.coverage.exclusions="**/*"

      - name: Restore dependencies
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: dotnet restore InnoClinic.Profiles.slnx

      - name: Build
        run: dotnet build InnoClinic.Profiles.slnx --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --solution InnoClinic.Profiles.slnx --no-build --configuration Release

      - name: End SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ~/.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
