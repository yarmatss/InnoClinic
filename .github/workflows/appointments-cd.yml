name: Appointments Microservice CD

on:
  workflow_run:
    workflows: ["Appointments Microservice CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  RESOURCE_GROUP: rg-innoclinic-dev
  CONTAINER_APP_NAME: appointments-api
  IMAGE_NAME: innoclinic-appointments-api
  FUNCTION_APP_NAME: fn-innoclinic-appointments-dev
  REGISTRY: ghcr.io

jobs:
  deploy-api:
    name: Build & Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Appointments API image
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          file: ./Backend/Appointments/Appointments.API/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          secrets: |
            NUGET_USER=${{ secrets.NUGET_USER }}
            NUGET_TOKEN=${{ secrets.NUGET_TOKEN }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Appointments API
        uses: azure/cli@v3
        with:
          inlineScript: |
            az containerapp update \
              --name "${CONTAINER_APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --image "${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.event.workflow_run.head_sha }}"

  deploy-functions:
    name: Build & Deploy Functions
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: dotnet restore ./Backend/Appointments/Appointments.Functions/Appointments.Functions.csproj

      - name: Build and Publish
        run: |
          dotnet publish ./Backend/Appointments/Appointments.Functions/Appointments.Functions.csproj \
            -c Release \
            --no-restore \
            -o ./publish-functions

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ./publish-functions
